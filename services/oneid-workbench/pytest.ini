; 失败重试策略（pytest-rerunfailures）
;
; 只对**环境类**异常重试，不对断言失败重试：
;   MailCodeError  - 邮箱 180s 内未收到验证码（邮件服务延迟）
;   TimeoutError   - Playwright 等元素/弹窗超时（页面响应慢）
; AssertionError 故意不在名单内——真实功能缺陷必须一次暴露，
; 否则会被重试掩盖，且每次重试要多花约 2 分钟验证码时间。
;
; reruns-delay 设 70s：略大于验证码 65s 冷却窗口，
; 让重试时能立刻拿到新码，不必再等限流。

[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings
    --reruns 1
    --reruns-delay 70
    --only-rerun MailCodeError
    --only-rerun TimeoutError

markers =
    slow: 标记慢速测试（需身份验证，约 2-3 分钟/个）
    fast: 标记快速测试（仅前端校验，< 10 秒/个）
    skip: 跳过的测试

testpaths = tests

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
