name: Integration Tests CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  base-community-tests:
    runs-on: ubuntu-latest
    name: Meeting Server - Base Community Tests
    steps:
      - uses: actions/checkout@v4

      - name: Run base community tests
        run: |
          chmod +x services/meeting-server/base_community/run_all.sh
          bash services/meeting-server/base_community/run_all.sh

  openeuler-community-tests:
    runs-on: ubuntu-latest
    name: Meeting Server - openEuler Community Tests
    steps:
      - uses: actions/checkout@v4

      - name: Run openEuler community tests
        run: |
          chmod +x services/meeting-server/openeuler_community/run_all.sh
          bash services/meeting-server/openeuler_community/run_all.sh
