name: 测试交付件评审与修复

# TSE 自动评审 + 自动修订：当模块融合草稿 PR（含 services/<module>/ 测试交付件）出现或更新时，
# 由测试 TSE agent 评审模块测试策略 + 模块全量用例：
#   - 通过 → gh pr ready + gh pr merge（自动转正式并合入）
#   - 不通过 且自动修订未满 3 轮 → 回评问题清单 + 调 Integration-Test-Agent 按裁决就地修订
#   - 不通过 且已修订满 3 轮（第 4 次评审仍 FAIL）→ 回复「测试设计不合格，请重新设计提交。」，不再修订
#
# 触发用 pull_request（不是 issue_comment）——天然无评论回环问题。
# ⚠️ 防死循环：自动修订 commit 带 [auto-revise] 标记，按本 PR 的 [auto-revise] 提交数计轮，
#    最多 3 轮；满 3 轮后第 4 次评审仍 FAIL 时走拒绝分支、不再 push → 闭环终止。
# Agent 来自 agent-development-specification:
#   评审 spec/teams/agents/test-review/AGENT.md
#   修订 spec/teams/agents/integration-test/AGENT.md（修订模式）

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'services/*/TestStrategy.md'
      - 'services/*/test_cases.py'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: review-pr-${{ github.event.pull_request.number }}
  # false：自动修订 push 会触发 synchronize 重审，不能把重审 run 取消掉。
  cancel-in-progress: false

jobs:
  review:
    # 只评审本仓的草稿 PR（fork PR 无法安全 checkout/merge）。
    if: >-
      github.event.pull_request.draft == true
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ai-dev-runner]
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          # persist-credentials: false —— 否则 checkout 会把 GITHUB_TOKEN 焊进
          # http.extraheader，而 extraheader 优先级高于 origin URL 里的 userinfo，
          # 导致 auto-revise 步骤 set-url 注入的 GEORGE_TOKEN(PAT) 形同虚设、push
          # 实际仍走 GITHUB_TOKEN。GITHUB_TOKEN push 不触发新 workflow → synchronize
          # 重审永远不会发生，评审→修复→评审循环就此断掉。关掉持久化，PAT 才真正生效。
          persist-credentials: false

      - name: Locate module test deliverables in PR
        id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUM" --repo "$REPO" --json files -q '.files[].path' > pr-files.txt
          grep -E '^services/[^/]+/(TestStrategy\.md|test_cases\.py)$' pr-files.txt > target-files.txt || true
          if [ ! -s target-files.txt ]; then
            echo "::notice::No module test deliverables (TestStrategy.md / test_cases.py) in PR; skipping review."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          # 防死循环（务必保持）：统计本 PR 已发生的自动修订轮数 = 带 [auto-revise]
          # 标记的提交数。上限 3 轮：满 3 轮后第 4 次评审若仍 FAIL，直接回复拒绝、
          # 不再自动修订 → 闭环终止。
          REVISE_COUNT=$(gh pr view "$PR_NUM" --repo "$REPO" --json commits \
            -q '[.commits[] | select(.messageHeadline | contains("[auto-revise]"))] | length')
          echo "revise_count=$REVISE_COUNT" >> "$GITHUB_OUTPUT"
          if [ "$REVISE_COUNT" -lt 3 ]; then
            echo "can_revise=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_revise=false" >> "$GITHUB_OUTPUT"
            echo "::notice::auto-revise budget exhausted ($REVISE_COUNT/3); a FAIL will reject."
          fi
          echo "::notice::auto-revise rounds so far: $REVISE_COUNT (cap 3)"
          echo "Review targets:"
          cat target-files.txt

      - name: Fetch agent specs (TSE reviewer + integration-test reviser)
        if: steps.files.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GEORGE_TOKEN }}
          SPEC_REPO: agentic-develop-playground/agent-development-specification
        run: |
          set -euo pipefail
          mkdir -p ${RUNNER_TEMP}/review
          gh api "/repos/${SPEC_REPO}/contents/spec/teams/agents/test-review/AGENT.md" \
            -H "Accept: application/vnd.github.raw" > ${RUNNER_TEMP}/review/agent.md
          # 修订模式用：FAIL 时按裁决就地改模块交付件。
          gh api "/repos/${SPEC_REPO}/contents/spec/teams/agents/integration-test/AGENT.md" \
            -H "Accept: application/vnd.github.raw" > ${RUNNER_TEMP}/review/reviser.md
          wc -c ${RUNNER_TEMP}/review/*.md

      - name: Setup opencode
        if: steps.files.outputs.found == 'true'
        env:
          HOME: /home/runner
          OPENCODE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          set -euo pipefail
          if ! command -v opencode >/dev/null 2>&1; then
            npm install -g opencode-ai || curl -fsSL https://opencode.ai/install | bash
          fi
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.opencode/bin:$PATH"
          command -v opencode || { echo "::error::opencode install failed"; exit 1; }
          opencode --version || true
          mkdir -p "$HOME/.local/share/opencode" "$HOME/.config/opencode"
          printf '{"alibaba-cn":{"type":"api","key":"%s"}}\n' "$OPENCODE_API_KEY" > "$HOME/.local/share/opencode/auth.json"
          chmod 600 "$HOME/.local/share/opencode/auth.json"
          printf '{"$schema":"https://opencode.ai/config.json"}\n' > "$HOME/.config/opencode/opencode.json"

      - name: Review via opencode (TSE)
        id: review
        if: steps.files.outputs.found == 'true'
        env:
          HOME: /home/runner
          OPENCODE_MODEL: alibaba-cn/glm-5
        run: |
          set -euo pipefail
          command -v opencode >/dev/null 2>&1 || { echo "::error::opencode missing from PATH after Setup"; exit 1; }
          rm -f .review-verdict.md
          python3 - <<'PY'
          import os, pathlib, subprocess, sys

          RT = os.environ["RUNNER_TEMP"]
          role = pathlib.Path(f"{RT}/review/agent.md").read_text(encoding="utf-8")

          targets = [l.strip() for l in pathlib.Path("target-files.txt").read_text().splitlines() if l.strip()]
          strategies = [t for t in targets if t.endswith("TestStrategy.md")]
          cases = [t for t in targets if t.endswith("test_cases.py")]

          review_inputs = []
          n = 1
          for s in strategies:
              review_inputs.append(f"{n}. 模块测试策略：{s}")
              n += 1
          for c in cases:
              review_inputs.append(f"{n}. 模块全量用例脚本（pytest）：{c}")
              n += 1

          prompt = role + "\n\n" + "\n".join([
              "================ 本次任务 ================",
              "",
              "【评审对象（模块融合级）】（用 Read 读取）",
              *review_inputs,
              "",
              "【重点】这是模块融合后的全量交付件——除常规维度外，确认本次新增用例已并入、"
              "且模块既有用例未被误删 / 覆盖（融合应为增量）。",
              "",
              "【裁决输出】",
              "- 把评审裁决写入仓库根的 `.review-verdict.md`；第一行必须严格是 `VERDICT: PASS` 或 `VERDICT: FAIL`。",
              "- FAIL 时第一行之后逐条列出问题（文件+位置 | 问题 | 期望/建议）。",
              "- 只写 `.review-verdict.md` 这一个文件，绝不修改被评审的文件。",
          ])

          print("::group::opencode TSE review prompt")
          print(prompt)
          print("::endgroup::", flush=True)

          r = subprocess.run(
              ["opencode", "run",
               "--model", os.environ.get("OPENCODE_MODEL", "alibaba-cn/glm-5"),
               "--agent", "build",
               "--dangerously-skip-permissions",
               "--thinking=false",
               prompt],
              text=True,
          )
          if r.returncode != 0:
              print(f"::error::opencode exited {r.returncode}", file=sys.stderr)
              sys.exit(r.returncode)
          PY
          if [ ! -f .review-verdict.md ]; then
            echo "::error::TSE agent did not produce .review-verdict.md"
            exit 1
          fi
          echo "::group::verdict file"; cat .review-verdict.md; echo "::endgroup::"
          VERDICT=$(head -1 .review-verdict.md | grep -oE 'PASS|FAIL' | head -1 || true)
          [ -z "$VERDICT" ] && VERDICT=FAIL
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          echo "::notice::TSE verdict=$VERDICT"

      - name: PASS → promote draft to ready + merge
        if: steps.files.outputs.found == 'true' && steps.review.outputs.verdict == 'PASS'
        env:
          # ready/merge 需 PAT(admin 合并)；评论统一用 BOT_TOKEN → github-actions[bot] 发出。
          GH_TOKEN: ${{ secrets.GEORGE_TOKEN }}
          BOT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          GH_TOKEN="$BOT_TOKEN" gh pr comment "$PR_NUM" --repo "$REPO" --body "✅ \`测试交付件评审与修复\`（TSE）通过 — 自动将草稿 PR 转为正式并合入。

          run 日志：${RUN_URL}" || true
          gh pr ready "$PR_NUM" --repo "$REPO"
          gh pr merge "$PR_NUM" --repo "$REPO" --merge --admin --delete-branch

      - name: FAIL → comment issues (or reject when revise budget exhausted)
        if: steps.files.outputs.found == 'true' && steps.review.outputs.verdict != 'PASS'
        env:
          # 纯评论步骤：用 GITHUB_TOKEN → github-actions[bot] 发出。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REVISE_COUNT: ${{ steps.files.outputs.revise_count }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "${REVISE_COUNT:-0}" -ge 3 ]; then
            # 已自动修订 3 轮、第 4 次评审仍 FAIL → 直接判不合格，交还人工重新设计。
            {
              echo "测试设计不合格，请重新设计提交。"
              echo
              echo "（TSE 已自动修订 3 轮仍未通过；详见历次评审意见与 run：${RUN_URL}）"
            } > "${RUNNER_TEMP}/review-comment.md"
          else
            NEXT=$((REVISE_COUNT + 1))
            {
              echo "❌ \`测试交付件评审与修复\`（TSE）未通过（将进行第 ${NEXT}/3 轮自动修订）："
              echo
              cat .review-verdict.md
              echo
              echo "下面自动调用 Integration-Test-Agent 按以上意见修订；满 3 轮仍未通过将判定不合格。"
              echo
              echo "run 日志：${RUN_URL}"
            } > "${RUNNER_TEMP}/review-comment.md"
          fi
          gh pr comment "$PR_NUM" --repo "$REPO" --body-file "${RUNNER_TEMP}/review-comment.md" || true

      - name: FAIL → auto-revise via Integration-Test-Agent (bounded, ≤3 rounds)
        if: steps.files.outputs.found == 'true' && steps.review.outputs.verdict != 'PASS' && steps.files.outputs.can_revise == 'true'
        env:
          HOME: /home/runner
          OPENCODE_MODEL: alibaba-cn/glm-5
          # push 走 PAT(set-url 注入 GEORGE_TOKEN，触发 synchronize 重审)；评论用 BOT_TOKEN。
          GH_TOKEN: ${{ secrets.GEORGE_TOKEN }}
          BOT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REVISE_COUNT: ${{ steps.files.outputs.revise_count }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Pre-clean scratch left from previous runs on the same self-hosted workspace.
          rm -f .revise-summary.md
          python3 - <<'PY'
          import os, pathlib, subprocess, sys
          RT = os.environ["RUNNER_TEMP"]
          role = pathlib.Path(f"{RT}/review/reviser.md").read_text(encoding="utf-8")
          targets = [l.strip() for l in pathlib.Path("target-files.txt").read_text().splitlines() if l.strip()]
          lines = ["================ 本次任务（修订模式）================","","【反馈来源】TSE 评审裁决，反馈正文见：.review-verdict.md","","【待修订的既有模块交付件】（Read 后就地改）"]
          for t in targets:
              kind = "模块测试策略" if t.endswith("TestStrategy.md") else "模块全量用例脚本"
              lines.append(f"- {kind}：{t}")
          lines += ["","按「修订模式」规则就地修改这些文件；只改反馈涉及的部分；保留其他来源既有条目；不要写任何 meta / 过程性内容。","","另外按 agent 修订模式要求写一份简短 `.revise-summary.md`（仓库根，≤12 行）逐条对应反馈说明本轮实际改动——workflow 会把它作为 PR 评论回贴。"]
          prompt = role + "\n\n" + "\n".join(lines)
          print("::group::opencode revise prompt"); print(prompt); print("::endgroup::", flush=True)
          r = subprocess.run(["opencode","run","--model",os.environ.get("OPENCODE_MODEL","alibaba-cn/glm-5"),
                              "--agent","build","--dangerously-skip-permissions","--thinking=false", prompt], text=True)
          if r.returncode != 0:
              print(f"::error::opencode exited {r.returncode}", file=sys.stderr); sys.exit(r.returncode)
          PY
          git config user.name "GeorgeCao-hw"
          git config user.email "57275663+GeorgeCao-hw@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          rm -f .review-verdict.md   # never commit the verdict scratch file
          while IFS= read -r f; do [ -f "$f" ] && git add -- "$f"; done < target-files.txt
          if git diff --cached --quiet; then
            echo "::notice::auto-revise produced no change."
            rm -f .revise-summary.md
            exit 0
          fi
          git commit -m "test(integration): auto-revise per TSE review [auto-revise]"
          git push
          # 把 agent 写的修订汇总作为评论回贴到 PR（用 BOT_TOKEN → github-actions[bot] 发出；
          # push 已用 GEORGE_TOKEN(PAT) 触发重审，评论身份与 push 身份分开）。
          if [ -s .revise-summary.md ]; then
            NEXT=$((REVISE_COUNT + 1))
            {
              printf '🛠 \`测试交付件评审与修复\` 第 %s/3 轮自动修订已推送：\n\n' "$NEXT"
              cat .revise-summary.md
              printf '\n\n— run：%s\n' "$RUN_URL"
            } > "${RUNNER_TEMP}/revise-summary-comment.md"
            GH_TOKEN="$BOT_TOKEN" gh pr comment "$PR_NUM" --repo "$REPO" --body-file "${RUNNER_TEMP}/revise-summary-comment.md" || true
          else
            echo "::warning::agent did not produce .revise-summary.md; skipping summary comment."
          fi
          rm -f .revise-summary.md

      - name: Comment — infra failure
        if: failure()
        env:
          # 纯评论步骤：用 GITHUB_TOKEN → github-actions[bot] 发出。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUM" --repo "$REPO" --body "⚠️ \`测试交付件评审与修复\` 执行异常（非评审结论），详见 [run 日志](${RUN_URL})。修复后推送或 re-run。" || true
