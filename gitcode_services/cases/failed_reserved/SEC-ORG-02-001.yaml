id: SEC-ORG-02-001
dimensions:
- security
dimension: security
priority: P1
title: 组织级 secret 被错误地展示给未在白名单中的仓库
intent_ref: INTENT-SEC-027
test_type: ui
setup:
  repo_fixture: null
ui:
  url: https://gitcode.com/{owner}/{repo}/actions
  viewport:
    width: 1280
    height: 720
  actions:
  - type: wait_for_selector
    selector: body
    timeout: 10000
assertions:
- type: positive
  target: ui_element_visible
  selector: body
- type: positive
  target: ui_text_contains
  selector: body
  text: 流水线
teardown:
  reset: none
