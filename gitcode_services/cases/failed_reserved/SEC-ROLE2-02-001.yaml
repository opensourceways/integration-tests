---
id: SEC-ROLE2-02-001
dimensions: ["security"]
dimension: security
priority: P0
title: "低权限角色不应通过 Web UI 查看或触发仅限 Maintainer 的高权限 workflow"
intent_ref: INTENT-SEC-025
test_type: ui
setup:
  repo_fixture: null
ui:
  url: "https://gitcode.com/{owner}/{repo}/actions"
  viewport:
    width: 1280
    height: 720
  actions:
    - type: wait_for_selector
      selector: "body"
      timeout: 10000
assertions:
  - type: positive
    target: ui_element_visible
    selector: "body"
  - type: negative
    target: ui_text_contains
    selector: "body"
    text: "运行"
teardown:
  reset: none
