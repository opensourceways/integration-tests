id: SEC-FORK3-02-001
dimensions:
- security
dimension: security
priority: P0
title: fork PR 运行详情页不应向查看者展示 secrets 名称列表
intent_ref: INTENT-SEC-028
test_type: ui
setup:
  repo_fixture: null
ui:
  url: https://gitcode.com/{owner}/{repo}/actions/runs/1
  viewport:
    width: 1280
    height: 720
  actions:
  - type: wait_for_selector
    selector: body
    timeout: 10000
assertions:
- type: positive
  target: ui_element_visible
  selector: body
- type: negative
  target: ui_text_contains
  selector: body
  text: Secrets
teardown:
  reset: none
