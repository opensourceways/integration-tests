---
id: UI-SEARCH-25-001
dimensions: ["usability"]
dimension: usability
priority: P1
title: 全局搜索输入响应与结果分类展示
intent_ref: INTENT-USE-007
test_type: ui
setup:
  repo_fixture: null
ui:
  url: "https://gitcode.com/search"
  viewport:
    width: 1280
    height: 720
  actions:
    - type: wait_for_selector
      selector: "input[type='search'], [class*='search'] input, .search-input"
      timeout: 10000
    - type: type
      selector: "input[type='search'], [class*='search'] input, .search-input"
      value: "test"
    - type: click
      selector: "button:has-text('搜索'), .search-button, [type='submit']"
    - type: wait
      ms: 5000
    - type: click
      selector: "button:has-text('仓库'), .tab-repo, [class*='repo']"
    - type: wait
      ms: 3000
assertions:
  - type: positive
    target: ui_text_contains
    selector: "body"
    text: "test"
  - type: positive
    target: ui_element_visible
    selector: ".search-results, [class*='result'], .result-list"
  - type: positive
    target: ui_url_match
    contains: "q="
teardown:
  reset: none
