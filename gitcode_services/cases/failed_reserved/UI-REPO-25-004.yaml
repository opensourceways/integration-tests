---
id: UI-REPO-25-004
dimensions: ["completeness"]
dimension: completeness
priority: P1
title: 分支列表管理与保护规则功能覆盖
intent_ref: INTENT-COMP-006
test_type: ui
setup:
  repo_fixture: null
ui:
  url: "https://gitcode.com/{owner}/{repo}/branches"
  viewport:
    width: 1280
    height: 720
  actions:
    - type: wait_for_selector
      selector: ".branch-list, [class*='branch'], .branches-table"
      timeout: 10000
    - type: wait
      ms: 3000
    - type: click
      selector: "button:has-text('保护'), a:has-text('保护'), .protect-branch"
    - type: wait
      ms: 3000
    - type: wait_for_selector
      selector: ".protection-form, [class*='protection'], .branch-protection"
      timeout: 10000
assertions:
  - type: positive
    target: ui_element_visible
    selector: ".branch-list, [class*='branch'], .branches-table"
  - type: positive
    target: ui_text_contains
    selector: "body"
    text: "保护"
  - type: positive
    target: ui_element_visible
    selector: ".protection-form, [class*='protection'], .branch-protection"
teardown:
  reset: none
