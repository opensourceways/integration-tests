---
id: SEC-FORK-02-001
dimensions: ["security"]
dimension: security
priority: P0
title: "fork PR 在 pull_request 事件中无法读取仓库 secrets"
intent_ref: INTENT-SEC-001
test_type: workflow
setup:
  repo_fixture: with-fork-pr
  secrets: ["API_KEY"]
workflow: |
  name: test-fork-secret
  on:
    pull_request:
      branches: [main]
  jobs:
    test:
      name: test secret access
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: checkout
          uses: checkout
        - name: echo secret
          run: |
            echo "Secret is ${{ secrets.API_KEY }}"
trigger:
  event: fork_pr
  as: untrusted_contributor
fault_injection: null
assertions:
  - type: negative
    target: run_logs
    must_not_contain_secret: "API_KEY"
  - type: positive
    target: run_status
    equals: "completed"
teardown:
  reset: fixture
