---
id: SEC-MASK-02-001
dimensions: ["security"]
dimension: security
priority: P0
title: "通过 base64 拼接多行等方式绕过日志脱敏引擎"
intent_ref: INTENT-SEC-002
test_type: workflow
setup:
  repo_fixture: with-secrets
  secrets: ["MASK_VAL"]
workflow: |
  name: test-mask-bypass
  on:
    workflow_dispatch:
  jobs:
    test:
      name: test mask bypass
      runs-on: [ubuntu-latest, x64, small]
      steps:
        - name: checkout
          uses: checkout
        - name: base64 secret
          run: |
            echo "b64: $(echo -n '${{ secrets.MASK_VAL }}' | base64)"
        - name: concat secret
          run: |
            echo "part1: ${MASK_VAL:0:4}"
            echo "part2: ${MASK_VAL:4}"
          env:
            MASK_VAL: ${{ secrets.MASK_VAL }}
trigger:
  event: workflow_dispatch
  as: maintainer
fault_injection: null
assertions:
  - type: negative
    target: run_logs
    must_not_contain_secret: "MASK_VAL"
  - type: positive
    target: run_status
    equals: "completed"
teardown:
  reset: fixture
