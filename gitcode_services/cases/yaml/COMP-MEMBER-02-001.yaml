id: COMP-MEMBER-02-001
dimensions:
- completeness
- security
dimension: completeness
priority: P0
title: 仓库成员管理页面邀请流程与角色即时生效
intent_ref: INTENT-SPEC-017
test_type: ui
setup:
  repo_fixture: null
ui:
  url: https://gitcode.com/{owner}/{repo}/settings/members
  viewport:
    width: 1280
    height: 720
  actions:
  - type: wait_for_selector
    selector: body
    timeout: 10000
assertions:
- type: positive
  target: ui_text_contains
  selector: body
  text: 页面找不到或无权限
- type: positive
  target: ui_element_visible
  selector: body
teardown:
  reset: none
