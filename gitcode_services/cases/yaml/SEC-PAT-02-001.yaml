id: SEC-PAT-02-001
dimensions:
- security
dimension: security
priority: P0
title: 已创建的 PAT 不应在 Web UI 中可再次查看完整明文
intent_ref: INTENT-SEC-026
test_type: ui
setup:
  repo_fixture: null
ui:
  url: https://gitcode.com/settings/tokens
  viewport:
    width: 1280
    height: 720
  actions:
  - type: wait_for_selector
    selector: body
    timeout: 10000
assertions:
- type: positive
  target: ui_page_title
  text: '404'
- type: negative
  target: ui_text_contains
  selector: body
  text: 复制完整令牌
teardown:
  reset: none
