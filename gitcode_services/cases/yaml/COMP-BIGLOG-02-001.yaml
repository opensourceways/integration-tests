---
id: COMP-BIGLOG-02-001
dimensions: ["reliability", "usability"]
dimension: completeness
priority: P1
title: "超大日志或超大 diff 在 UI 中的加载性能与边界处理"
intent_ref: INTENT-SPEC-024
test_type: ui
setup:
  repo_fixture: null
  secrets: []
ui:
  url: "https://gitcode.com/{owner}/{repo}/actions"
  viewport:
    width: 1280
    height: 720
  actions:
    - type: wait_for_selector
      selector: "body"
      timeout: 10000
assertions:
  - type: positive
    target: ui_element_visible
    selector: "body"
teardown:
  reset: none
