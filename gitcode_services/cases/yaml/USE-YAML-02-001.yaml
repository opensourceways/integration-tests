---
id: USE-YAML-02-001
dimensions: ["usability"]
dimension: usability
priority: P0
title: "流水线配置语法错误时的静态校验 UI 提示"
intent_ref: INTENT-USE-024
test_type: ui
setup:
  repo_fixture: null
ui:
  url: "https://gitcode.com/{owner}/{repo}/blob/main/.gitcode/workflows/test.yml"
  viewport:
    width: 1280
    height: 720
  actions:
    - type: wait_for_selector
      selector: "body"
      timeout: 10000
assertions:
  - type: positive
    target: ui_element_visible
    selector: "body"
  - type: positive
    target: ui_text_contains
    selector: "body"
    text: "workflow"
teardown:
  reset: none
