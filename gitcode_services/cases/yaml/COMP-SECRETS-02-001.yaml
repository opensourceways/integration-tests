---
id: COMP-SECRETS-02-001
dimensions: ["security", "completeness"]
dimension: security
priority: P0
title: "项目 Settings Secrets 页面不展示 secret 原值"
intent_ref: INTENT-SPEC-011
test_type: ui
setup:
  repo_fixture: null
ui:
  url: "https://gitcode.com/{owner}/{repo}/settings/secrets"
  viewport:
    width: 1280
    height: 720
  actions:
    - type: wait_for_selector
      selector: "[class*='secret'], [class*='Secret'], .secrets, table"
      timeout: 10000
    - type: screenshot
      path: "secrets_page.png"
assertions:
  - type: negative
    target: ui_text_contains
    selector: "body"
    text: "{{ secrets.DEPLOY_KEY }}"
  - type: positive
    target: ui_text_contains
    selector: "body"
    text: "***"
  - type: positive
    target: ui_element_visible
    selector: "body"
teardown:
  reset: none
