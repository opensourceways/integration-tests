id: COMP-PRTRISK-02-001
dimensions:
- compatibility
- security
dimension: compatibility
priority: P0
title: pull_request_target 事件下 checkout PR 代码的 UI 风险提示
intent_ref: INTENT-SPEC-020
test_type: ui
setup:
  repo_fixture: null
ui:
  url: https://gitcode.com/{owner}/{repo}/merge_requests/1/checks
  viewport:
    width: 1280
    height: 720
  actions:
  - type: wait_for_selector
    selector: body
    timeout: 10000
assertions:
- type: positive
  target: ui_text_contains
  selector: body
  text: 页面找不到或无权限
- type: positive
  target: ui_element_visible
  selector: body
teardown:
  reset: none
