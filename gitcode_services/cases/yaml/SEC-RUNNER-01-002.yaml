---
id: SEC-RUNNER-01-002
dimensions: ["security"]
dimension: security
priority: P1
title: 自托管 Runner 注册令牌不得在工作流日志或环境变量中泄露
intent_ref: INTENT-SEC-020
test_type: workflow
setup:
  repo_fixture: ComputingActionTest/bingo
  secrets: ["RUNNER_REGISTRATION_TOKEN"]
trigger:
  event: workflow_dispatch
workflow: |
  name: test-runner-token-leak
  on:
    workflow_dispatch:
  jobs:
    test:
      name: runner token leak test
      runs-on: [self-hosted, x64, small]
      steps:
        - name: dump env
          run: |
            env | sort
        - name: check logs
          run: |
            echo 'done'
assertions:
  - type: negative
    target: run_logs
    must_not_contain_secret: RUNNER_REGISTRATION_TOKEN
  - type: positive
    target: run_status
    equals: completed
teardown:
  reset: fixture
