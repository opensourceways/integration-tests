id: COMP-ENV-02-001
dimensions:
- security
- completeness
dimension: security
priority: P0
title: 环境设置页中 Secret 绑定与审批人配置生效
intent_ref: INTENT-SPEC-013
test_type: ui
setup:
  repo_fixture: null
ui:
  url: https://gitcode.com/{owner}/{repo}/settings/environments
  viewport:
    width: 1280
    height: 720
  actions:
  - type: wait_for_selector
    selector: body
    timeout: 10000
  - type: screenshot
    path: env_page.png
assertions:
- type: positive
  target: ui_text_contains
  selector: body
  text: 页面找不到或无权限
- type: positive
  target: ui_element_visible
  selector: body
teardown:
  reset: none
