---
id: UI-CODE-25-002
dimensions: ["completeness"]
dimension: completeness
priority: P2
title: 代码 Blame 视图与 Raw 文件查看可达性
intent_ref: INTENT-COMP-011
test_type: ui
setup:
  repo_fixture: null
ui:
  url: "https://gitcode.com/{owner}/{repo}/blob/main/README.md"
  viewport:
    width: 1280
    height: 720
  actions:
    - type: wait_for_selector
      selector: ".blob-content, [class*='content'], .file-content"
      timeout: 10000
    - type: wait
      ms: 2000
    - type: click
      selector: "button:has-text('Blame'), a:has-text('Blame'), .blame-tab"
    - type: wait
      ms: 3000
    - type: wait_for_selector
      selector: ".blame-content, [class*='blame'], .blame-view"
      timeout: 10000
    - type: navigate
      url: "https://gitcode.com/{owner}/{repo}/raw/main/README.md"
    - type: wait
      ms: 3000
assertions:
  - type: positive
    target: ui_text_contains
    selector: "body"
    text: "README"
  - type: positive
    target: ui_url_match
    contains: "raw"
  - type: positive
    target: ui_element_visible
    selector: "pre, .raw-content, body"
teardown:
  reset: none
