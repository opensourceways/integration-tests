id: SEC-FORK2-02-001
dimensions:
- security
dimension: security
priority: P0
title: 外部 fork 贡献者不应通过 Web UI 看到目标仓库 secrets 列表
intent_ref: INTENT-SEC-022
test_type: ui
setup:
  repo_fixture: null
ui:
  url: https://gitcode.com/{owner}/{repo}/settings/secrets
  viewport:
    width: 1280
    height: 720
  actions:
  - type: wait_for_selector
    selector: body
    timeout: 10000
assertions:
- type: positive
  target: ui_text_contains
  selector: body
  text: 页面找不到或无权限
- type: negative
  target: ui_text_contains
  selector: body
  text: DEPLOY_TOKEN
teardown:
  reset: none
