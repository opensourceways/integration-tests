---
id: COMPAT-RUNNER-02-001
dimensions: ["compatibility"]
dimension: compatibility
priority: P1
title: "Runner 标签三段式在 UI 中的选择器与合法性校验"
intent_ref: INTENT-SPEC-028
test_type: ui
setup:
  repo_fixture: null
  secrets: []
ui:
  url: "https://gitcode.com/{owner}/{repo}/actions"
  viewport:
    width: 1280
    height: 720
  actions:
    - type: wait_for_selector
      selector: "body"
      timeout: 10000
assertions:
  - type: positive
    target: ui_element_visible
    selector: "body"
teardown:
  reset: none
